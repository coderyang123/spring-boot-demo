# 数据库配置
spring:
  datasource:
    jdbc-url: jdbc:mysql://IP:3306/jpa?useUnicode=true&characterEncoding=UTF-8&useSSL=false&autoReconnect=true&failOverReadOnly=false&serverTimezone=GMT%2B8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: SpringBootDemoHikariCP
      max-lifetime: 60000
      connection-timeout: 30000

  # JPA配置
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        enable_lazy_load_no_trans: true # 解决多对多延迟加载错误问题
        dialect: org.hibernate.dialect.MySQL57InnoDBDialect
    open-in-view: true

# 日志配置
logging:
  level:
    com.demo: debug
    org.hibernate.SQL: debug
    org.hibernate.type: trace