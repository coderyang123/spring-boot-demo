<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebSocket客户端</title>
    <script src="https://cdn.bootcss.com/sockjs-client/0.3.4/sockjs.min.js"></script>
    <link href="https://cdn.bootcss.com/twitter-bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .jumbotron {
            width: 100%;
        }

        #text {
            height: 3rem;
            font-size: 1rem;
            line-height: 3rem;
            margin: 1rem;
        }

        .btn {
            margin-right: 5px;
        }

        #connect {
            margin-left: 1rem;
        }

        #log {
            margin: 1rem 0 0 1rem;
        }

    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <div class="jumbotron">
            <input class="col-lg-12" id="text" placeholder="请输入你想传输的内容" type="text"/>
            <input class="btn btn-info" id="connect" onclick="connect()" type="button" value="连接"/>
            <input class="btn btn-success" disabled="disabled" id="sent" onclick="sent()" type="button" value="发送"/>
            <input class="btn btn-danger" disabled="disabled" id="disconnect" onclick="disconnect()" type="button"
                   value="断开"/>

            <div id="log">
                <p>聊天记录:</p>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript">
    let text = document.querySelector('#text');
    let connectBtn = document.querySelector("#connect");
    let sentBtn = document.querySelector("#sent");
    let disconnectBtn = document.querySelector("#disconnect");
    let logDiv = document.querySelector("#log");

    let ws = null;

    function connect() {
        let targetUri = "/connect";
        ws = new SockJS(targetUri);
        ws.onopen = function () {
            setConnected(true);
            log('和服务端连接成功！');
        };
        ws.onmessage = function (event) {
            log('服务端说：' + event.data);
        };
        ws.onclose = function () {
            setConnected(false);
            log('和服务端断开连接！')
        }
    }

    function sent() {
        if (ws != null) {
            ws.send(text.value);
            log('客户端说：' + text.value);
        } else {
            log('请先建立连接！')
        }
    }

    function disconnect() {
        if (ws != null) {
            ws.close();
            ws = null;
        }
        setConnected(false);
    }

    function log(value) {
        let content = document.createElement('p');
        content.innerHTML = value;
        logDiv.appendChild(content);
        text.value = '';
    }

    function setConnected(connected) {
        connectBtn.disabled = connected;
        disconnectBtn.disabled = !connected;
        sentBtn.disabled = !connected;
    }
</script>
</body>
</html>
