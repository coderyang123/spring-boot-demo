version: '3'
services:
  zookeeper:
    image: zookeeper:3.8.0
    container_name: zookeeper-3.8.0
    ports:
      - 2182:2181
    restart: always
    networks:
      - kafka_network

  kafka1:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka1-2.8.1
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: IP:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://IP:9093
    volumes:
      - /opt/kafka_cluster/broker1/logs:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    depends_on:
      - zookeeper
    networks:
      - kafka_network

  kafka2:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka2-2.8.1
    ports:
      - "9094:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: IP:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://IP:9094
    volumes:
      - /opt/kafka_cluster/broker2/logs:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    depends_on:
      - zookeeper
    networks:
      - kafka_network

  kafka3:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: kafka3-2.8.1
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_ZOOKEEPER_CONNECT: IP:2182
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://IP:9095
    volumes:
      - /opt/kafka_cluster/broker3/logs:/opt/kafka/logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    depends_on:
      - zookeeper
    networks:
      - kafka_network

  cmak:
    image: vimagick/cmak
    container_name: cmak-3.0.0.5
    ports:
      - "9000:9000"
    environment:
      ZK_HOSTS: IP:2182
    restart: always
    networks:
      - kafka_network

networks:
  kafka_network: { }
